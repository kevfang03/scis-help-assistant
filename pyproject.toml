[project]
name = "scis-help-assistant"
version = "0.1.0"
description = "Unofficial student project: a help assistant over the public SCIS support pages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0,<2",
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.14",
    "fastapi>=0.158.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.4",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
scis-help = "scis_help.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scis_help"]

[tool.uv]
# Build .venv on a uv-managed Python (3.12 from .python-version), never a system one: the
# Microsoft Store Python hides what it writes under %LOCALAPPDATA% in a private copy.
python-preference = "only-managed"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# ruff formats Python code blocks in Markdown; the interface sketches in docs/ are not code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
